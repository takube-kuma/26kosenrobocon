name: データベースに書き込む
description: チームの機構・作戦、試合結果、資料のリンクなどを追加／訂正します（送るとすぐページに出ます）
title: "[DB] "
labels: ["db-contrib"]
body:
  - type: markdown
    attributes:
      value: |
        高専ロボコン データベースへの書き込みです。送信するとすぐに、そのチーム・大会のページに「投稿」として表示されます。
        配信や会場で自分の目で見たことも歓迎です。どこで見たか（配信の時刻など）を書いてもらえると助かります。
  - type: input
    id: kind
    attributes: {label: 種類, description: "機構・しくみ／作戦・動き／試合の結果／チーム・ロボットの情報／資料・動画のリンク／その他の訂正"}
    validations: {required: true}
  - type: input
    id: year
    attributes: {label: 年度, placeholder: "2026"}
    validations: {required: true}
  - type: input
    id: district
    attributes: {label: 大会, description: "全国大会／北海道／東北／関東甲信越／東海北陸／近畿／中国／四国／九州沖縄"}
  - type: input
    id: team
    attributes: {label: 学校・チーム, description: "例: 大阪公大A／旭川（複数ならカンマ区切り）"}
  - type: input
    id: round
    attributes: {label: 試合, description: "試合のことなら。例: 予選A-1／決勝"}
  - type: textarea
    id: content
    attributes: {label: 内容, description: "例: 射出は上下2本のローラー。装填は横から1枚ずつ押し出している"}
    validations: {required: true}
  - type: input
    id: source
    attributes: {label: 出典・どこで見たか, description: "URL、または「配信 1:05:30」「会場で見た」など"}
